services:
  agent:
    build: .
    environment:
      # The Agent Index id this install reports under. Leave it: this is what
      # puts your install on Gazette's row of the leaderboard.
      AGENT_ID: gazette
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      # Written by `plow-agents mint <line>`.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across `up`/`down`: config, memory, cron jobs,
      # and the install id the Index counts you under. Name it, never
      # anonymous: a fresh volume is a fresh install on the leaderboard.
      - gazette-home:/var/lib/hermes
      # Rendered editions, kept so you can browse or print past issues.
      - gazette-editions:/srv/gazette/editions
    # The agent checkpoints its session on SIGTERM and its supervisor allows
    # 30s for that, so Docker's own deadline has to sit outside that one.
    stop_grace_period: 35s

volumes:
  gazette-home:
  gazette-editions:
